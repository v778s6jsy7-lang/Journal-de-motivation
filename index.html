// --- persistance locale (localStorage du téléphone) ---
function chargerLS(cle, defaut) {
  try {
    const brut = localStorage.getItem(cle);
    return brut !== null ? JSON.parse(brut) : defaut;
  } catch (e) {
    console.warn("Lecture impossible pour", cle, e);
    return defaut;
  }
}
function sauvegarderLS(cle, valeur) {
  try {
    localStorage.setItem(cle, JSON.stringify(valeur));
  } catch (e) {
    console.warn("Sauvegarde impossible pour", cle, "(mémoire du téléphone pleine ?)", e);
  }
}

// --- redimensionne une image avant de la stocker, pour ne pas saturer le stockage local ---
function redimensionnerImage(fichier, maxDim = 900, qualite = 0.82) {
  return new Promise((resolve, reject) => {
    const lecteur = new FileReader();
    lecteur.onerror = reject;
    lecteur.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", qualite));
      };
      img.src = e.target.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

function estBissextile(annee) {
  return (annee % 4 === 0 && annee % 100 !== 0) || annee % 400 === 0;
}
function joursDansAnnee(annee) {
  return estBissextile(annee) ? 366 : 365;
}
function joursDansMois(annee, mois) {
  return new Date(annee, mois + 1, 0).getDate();
}
function numeroDuJour(date) {
  const debut = new Date(date.getFullYear(), 0, 1);
  return Math.floor((date - debut) / 86400000) + 1;
}
function cleDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function cleMois(annee, mois) {
  return `${annee}-${mois}`;
}

// --- navigation entre types de pages ---
function vueAnnee(vue) {
  return vue.type === "jour" ? vue.date.getFullYear() : vue.annee;
}
function vueMois(vue) {
  if (vue.type === "jour") return vue.date.getMonth();
  if (vue.type === "projet") return vue.mois;
  return null;
}
function vueSuivante(vue) {
  if (vue.type === "objectif") return { type: "projet", annee: vue.annee, mois: 0 };
  if (vue.type === "projet") return { type: "jour", date: new Date(vue.annee, vue.mois, 1) };
  const d = new Date(vue.date);
  d.setDate(d.getDate() + 1);
  if (d.getDate() === 1) {
    if (d.getMonth() === 0) return { type: "objectif", annee: d.getFullYear() };
    return { type: "projet", annee: d.getFullYear(), mois: d.getMonth() };
  }
  return { type: "jour", date: d };
}
function vuePrecedente(vue) {
  if (vue.type === "objectif") return { type: "jour", date: new Date(vue.annee - 1, 11, 31) };
  if (vue.type === "projet") {
    if (vue.mois === 0) return { type: "objectif", annee: vue.annee };
    return { type: "jour", date: new Date(vue.annee, vue.mois, 0) };
  }
  if (vue.date.getDate() === 1) {
    return { type: "projet", annee: vue.date.getFullYear(), mois: vue.date.getMonth() };
  }
  const d = new Date(vue.date);
  d.setDate(d.getDate() - 1);
  return { type: "jour", date: d };
}

function jourToISO(annee, mois, jour) {
  return `${annee}-${String(mois + 1).padStart(2, "0")}-${String(jour).padStart(2, "0")}`;
}
function formatDateCourte(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return `${d.getDate()} ${MOIS[d.getMonth()].court.charAt(0)}${MOIS[d.getMonth()].court.slice(1).toLowerCase()}`;
}
function calculerProgressionPas(petitsPas, dateActuelle) {
  const avecDate = petitsPas
    .filter((p) => p.date)
    .map((p) => ({ ...p, dateObj: new Date(p.date + "T00:00:00") }))
    .sort((a, b) => a.dateObj - b.dateObj);
  if (avecDate.length === 0) return { prec: null, suiv: null, fraction: 0 };
  let prec = null, suiv = null;
  for (const p of avecDate) {
    if (p.dateObj <= dateActuelle) prec = p;
    if (p.dateObj > dateActuelle && !suiv) suiv = p;
  }
  const debutMs = prec ? prec.dateObj.getTime() : new Date(dateActuelle.getFullYear(), dateActuelle.getMonth(), 1).getTime();
  const finMs = suiv ? suiv.dateObj.getTime() : new Date(dateActuelle.getFullYear(), dateActuelle.getMonth() + 1, 0).getTime();
  const fraction = finMs === debutMs ? 1 : (dateActuelle.getTime() - debutMs) / (finMs - debutMs);
  return { prec, suiv, fraction: Math.max(0, Math.min(1, fraction)) };
}

      </button>

      <div className="flex flex-col gap-3">
        {moodboards.length === 0 && (
          <p className="text-xs italic" style={{ color: "#B3A48F" }}>Aucun mood board pour l'instant.</p>
        )}
        {moodboards.map((m) => (
          <button key={m.id} onClick={() => ouvrirMoodboard(m.id)} className="text-left rounded-sm px-3 py-3 transition-colors" style={{ background: "#EFE7D6", border: "1px solid rgba(107,79,46,0.15)" }}>
            <div className="text-sm mb-2" style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, color: "#2A231C" }}>
              {m.nom || "Sans nom"}
            </div>
            <div className="flex gap-1.5 items-center overflow-hidden">
              {m.images.slice(0, 5).map((img) => (
                <img key={img.id} src={img.url} alt="" className="rounded-sm flex-shrink-0" style={{ width: 44, height: 44, objectFit: "cover" }} />
              ))}
              {m.images.length === 0 && <span className="text-xs italic" style={{ color: "#B3A48F" }}>Aucune image</span>}
              {m.images.length > 5 && (
                <div className="flex items-center justify-center flex-shrink-0 rounded-sm text-xs" style={{ width: 44, height: 44, background: "#E4DAC7", color: "#6B5F4F" }}>
                  +{m.images.length - 5}
                </div>
              )}
            </div>
          </button>
        ))}
      </div>
    </div>
  );

  // ---------- rendu page DETAIL MOOD BOARD ----------
  const renderPageMoodboardDetail = () => {
    const board = vue.id === null ? brouillonMood : moodboards.find((m) => m.id === vue.id);
    if (!board) return null;
    return (
      <div className="pl-12 pr-8 pt-10 pb-12 flex flex-col">
        <div className="text-xs uppercase tracking-[0.3em] mb-4" style={{ color: "#6B4226" }}>Mood board</div>
        <input
          value={board.nom}
          onChange={(e) => majMoodboardCourant({ nom: e.target.value })}
          placeholder="Nom du mood..."
          className="w-full mb-3 px-1 py-1 outline-none"
          style={{ background: "transparent", border: "none", borderBottom: "1px solid rgba(107,79,46,0.25)", color: "#2A231C", fontFamily: "'Fraunces', serif", fontWeight: 500, fontSize: "1.8rem" }}
        />
        <textarea
          value={board.commentaire}
          onChange={(e) => majMoodboardCourant({ commentaire: e.target.value })}
          placeholder="Un commentaire sur ce mood..."
          rows={3}
          className="w-full mb-6 px-3 py-2 rounded-sm text-sm outline-none resize-none"
          style={{ background: "#EFE7D6", border: "1px solid rgba(107,79,46,0.15)", color: "#2A231C" }}
        />

        <SectionLabel>Images</SectionLabel>
        <div className="grid grid-cols-3 gap-2 mb-6">
          {board.images.map((img) => (
            <div key={img.id} className="relative">
              <img src={img.url} alt="" className="w-full rounded-sm" style={{ aspectRatio: "1", objectFit: "cover" }} />
              <button onClick={() => supprimerImage(img.id)} className="absolute top-1 right-1 flex items-center justify-center rounded-full" style={{ width: 20, height: 20, background: "rgba(36,30,27,0.7)" }} aria-label="Retirer l'image">
                <X size={11} color="#FBF7EE" />
              </button>
            </div>
          ))}
          <label className="flex flex-col items-center justify-center rounded-sm cursor-pointer transition-opacity hover:opacity-80" style={{ aspectRatio: "1", background: "#E4DAC7", border: "1px dashed rgba(107,79,46,0.35)" }}>
            <Plus size={18} color="#8B7C68" />
            <input type="file" accept="image/*" multiple className="hidden" onChange={gererAjoutImages} />
          </label>
        </div>

        <button onClick={terminerMoodboard} className="px-6 py-2 rounded-full text-sm self-start mb-4 transition-opacity hover:opacity-90" style={{ background: "#B8863B", color: "#FBF7EE" }}>
          Terminé
        </button>

        {vue.id !== null && (
          <button onClick={supprimerMoodboardCourant} className="text-xs self-start" style={{ color: "#8B4A2B" }}>
            Supprimer ce mood board
          </button>
        )}
      </div>
    );
  };

  return (
    <div className="w-full min-h-screen relative" style={{ background: "radial-gradient(ellipse at 50% 0%, #3A312C 0%, #241E1B 70%)", fontFamily: "'Newsreader', ui-serif, Georgia, serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap');`}</style>

      {/* top bar */}
      <div className="fixed top-0 left-0 right-0 z-30 flex items-center py-3 select-none px-4" style={{ background: "rgba(36,30,27,0.85)", backdropFilter: "blur(6px)" }}>
        <div style={{ width: "17px" }} />
        <div className="flex-1 flex items-center justify-center gap-3">
          <button onClick={() => allerObjectif(vue.type === "moodboards" || vue.type === "moodboard-detail" ? anneeMemoire : annee)} className="uppercase tracking-[0.25em] text-xs hover:opacity-70" style={{ color: "#C9BBA8" }}>Carnet</button>
          <span className="text-lg" style={{ color: "#EFE7D8", fontFamily: "'Fraunces', serif", fontWeight: 500 }}>{vue.type === "moodboards" || vue.type === "moodboard-detail" ? anneeMemoire : annee}</span>
          <div className="flex flex-col -space-y-1">
            <button onClick={() => changerAnnee(-1)} className="opacity-60 hover:opacity-100 transition-opacity" aria-label="Année précédente"><ChevronUp size={13} color="#C9BBA8" /></button>
            <button onClick={() => changerAnnee(1)} className="opacity-60 hover:opacity-100 transition-opacity" aria-label="Année suivante"><ChevronDown size={13} color="#C9BBA8" /></button>
          </div>
        </div>
        <button onClick={() => setParametresOuverts(true)} className="opacity-70 hover:opacity-100 transition-opacity flex-shrink-0" aria-label="Paramètres">
          <Settings size={17} color="#C9BBA8" />
        </button>
      </div>

      {/* month tabs + mood board tab */}
      <div className="fixed z-30" style={{ top: "50%", right: 0, transform: "translateY(-50%)" }}>
        {MOIS.map((m, idx) => {
          const actif = idx === moisActifIdx;
          return (
            <button key={m.nom} onClick={() => ouvrirMoisTab(idx)} className="block mb-[3px] transition-transform duration-150"
              style={{ width: actif ? 38 : 26, height: 26, background: m.couleur, borderTopLeftRadius: 4, borderBottomLeftRadius: 4, boxShadow: actif ? "-2px 2px 8px rgba(0,0,0,0.35)" : "-1px 1px 3px rgba(0,0,0,0.25)", opacity: actif ? 1 : 0.82 }}
              aria-label={`Aller à ${m.nom}`}>
              <span style={{ writingMode: "vertical-rl", color: "#FBF7EE", fontSize: 8, letterSpacing: "0.08em", fontWeight: 600, display: "block", textAlign: "center", paddingTop: 3 }}>{m.court}</span>
            </button>
          );
        })}
        {(() => {
          const actif = vue.type === "moodboards" || vue.type === "moodboard-detail";
          return (
            <button onClick={ouvrirListeMoodboards} className="block mt-2 transition-transform duration-150"
              style={{ width: actif ? 38 : 26, height: 30, background: "#6B4226", borderTopLeftRadius: 4, borderBottomLeftRadius: 4, boxShadow: actif ? "-2px 2px 8px rgba(0,0,0,0.35)" : "-1px 1px 3px rgba(0,0,0,0.25)", opacity: actif ? 1 : 0.82, display: "flex", alignItems: "center", justifyContent: "center" }}
              aria-label="Mood boards">
              <Smile size={13} color="#FBF7EE" />
            </button>
          );
        })()}
      </div>

      {/* content */}
      <div className="flex justify-center px-6" style={{ paddingTop: "76px", paddingBottom: "120px" }}>
        <div className="relative" style={{ width: "min(92vw, 480px)" }}>
          <div className="relative">
            <div className="absolute inset-0 rounded-sm" style={{ background: "#EDE3D0", transform: "translate(4px, 4px)", boxShadow: "0 20px 50px rgba(0,0,0,0.45)" }} />
            <div className="absolute inset-0 rounded-sm" style={{ background: "#F0E7D6", transform: "translate(2px, 2px)" }} />
            <div className="relative rounded-sm" style={{ background: "#F6F1E7", boxShadow: "0 24px 60px rgba(0,0,0,0.5)" }}>
              <div className="absolute left-0 top-0 bottom-0" style={{ width: 22, background: "linear-gradient(90deg, #6B4226 0%, #7A4F2E 40%, transparent 100%)", opacity: 0.5 }} />
              {vue.type === "jour" && renderPageJour()}
              {vue.type === "projet" && renderPageProjet()}
              {vue.type === "objectif" && renderPageObjectif()}
              {vue.type === "moodboards" && renderPageMoodboards()}
              {vue.type === "moodboard-detail" && renderPageMoodboardDetail()}
            </div>
          </div>
        </div>
      </div>

      {/* bottom bar */}
      <div className="fixed bottom-0 left-0 right-0 z-30 flex flex-col items-center gap-2 py-4" style={{ background: "rgba(36,30,27,0.85)", backdropFilter: "blur(6px)" }}>
        {vue.type === "moodboards" || vue.type === "moodboard-detail" ? (
          <button onClick={retourAujourdHui} className="flex items-center gap-1.5 px-4 py-2 rounded-full text-xs transition-opacity hover:opacity-80" style={{ background: "#B8863B", color: "#FBF7EE" }}>
            <RotateCcw size={12} /> Retour au carnet
          </button>
        ) : (
          <>
            {!estAujourdHui && (
              <button onClick={retourAujourdHui} className="flex items-center gap-1.5 px-3 py-1 rounded-full text-xs mb-1 transition-opacity hover:opacity-80" style={{ background: "#B8863B", color: "#FBF7EE" }}>
                <RotateCcw size={11} /> Aujourd'hui
              </button>
            )}
            <div className="flex items-center gap-8">
              <button onClick={allerPrecedent} className="flex items-center justify-center rounded-full transition-transform hover:scale-105" style={{ width: 42, height: 42, background: "#F6F1E7", boxShadow: "0 4px 14px rgba(0,0,0,0.35)" }} aria-label="Précédent">
                <ChevronLeft size={18} color="#4A3B2A" />
              </button>
              <span className="text-xs tracking-wide select-none w-32 text-center" style={{ color: "#C9BBA8" }}>{labelBas}</span>
              <button onClick={allerSuivant} className="flex items-center justify-center rounded-full transition-transform hover:scale-105" style={{ width: 42, height: 42, background: "#F6F1E7", boxShadow: "0 4px 14px rgba(0,0,0,0.35)" }} aria-label="Suivant">
                <ChevronRight size={18} color="#4A3B2A" />
              </button>
            </div>
          </>
        )}
      </div>

      {/* overlay gratitude */}
      {gratitudeOuverte && vue.type === "jour" && (() => {
        const date = vue.date;
        const pageNum = numeroDuJour(date);
        const exercice = GRATITUDE_EXERCICES[(pageNum - 1) % GRATITUDE_EXERCICES.length];
        const entree = getEntree(date);
        return (
          <div className="fixed inset-0 z-50 flex flex-col" style={{ background: "#F6F1E7" }}>
            <div className="flex items-center justify-between px-6 py-4" style={{ borderBottom: "1px solid rgba(107,79,46,0.15)" }}>
              <div className="text-xs uppercase tracking-[0.25em]" style={{ color: "#B8863B" }}>
                Gratitude — {date.getDate()} {MOIS[date.getMonth()].nom}
              </div>
              <button onClick={() => setGratitudeOuverte(false)} className="flex items-center justify-center rounded-full transition-opacity hover:opacity-70" style={{ width: 36, height: 36, background: "#E4DAC7" }} aria-label="Fermer">
                <X size={16} color="#4A3B2A" />
              </button>
            </div>
            <div className="flex-1 overflow-y-auto px-6 py-6 flex flex-col" style={{ maxWidth: "640px", margin: "0 auto", width: "100%" }}>
              <p className="italic text-lg leading-relaxed mb-6" style={{ color: "#4A3B2A", fontFamily: "'Fraunces', serif" }}>{exercice}</p>
              <textarea autoFocus value={entree.gratitude} onChange={(e) => majEntree(date, { gratitude: e.target.value })} placeholder="Écris ici..."
                className="flex-1 w-full resize-none outline-none text-base leading-loose bg-transparent"
                style={{ color: "#2A231C", fontFamily: "'Newsreader', serif", backgroundImage: "repeating-linear-gradient(transparent, transparent 34px, rgba(107,79,46,0.15) 35px)", minHeight: "300px" }} />
            </div>
            <div className="px-6 py-4 flex justify-center" style={{ borderTop: "1px solid rgba(107,79,46,0.15)" }}>
              <button onClick={() => setGratitudeOuverte(false)} className="px-6 py-2 rounded-full text-sm transition-opacity hover:opacity-85" style={{ background: "#B8863B", color: "#FBF7EE" }}>Terminé</button>
            </div>
          </div>
        );
      })()}

      {/* overlay paramètres */}
      {parametresOuverts && (
        <div className="fixed inset-0 z-50 flex flex-col" style={{ background: "#F6F1E7" }}>
          <div className="flex items-center justify-between px-6 py-4" style={{ borderBottom: "1px solid rgba(107,79,46,0.15)" }}>
            <div className="text-xs uppercase tracking-[0.25em]" style={{ color: "#B8863B" }}>Paramètres</div>
            <button onClick={() => setParametresOuverts(false)} className="flex items-center justify-center rounded-full transition-opacity hover:opacity-70" style={{ width: 36, height: 36, background: "#E4DAC7" }} aria-label="Fermer">
              <X size={16} color="#4A3B2A" />
            </button>
          </div>
          <div className="flex-1 overflow-y-auto px-6 py-6" style={{ maxWidth: "560px", margin: "0 auto", width: "100%" }}>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: "1.3rem", color: "#2A231C", marginBottom: "4px" }}>Récompenses</div>
            <p className="text-xs italic mb-5" style={{ color: "#A69884" }}>
              Cette liste est proposée partout où tu choisis une récompense (petits pas, phases de l'année).
            </p>
            <div className="flex flex-col gap-2 mb-5">
              {recompensesListe.map((r, idx) => (
                <div key={idx} className="flex items-center gap-2">
                  <input
                    value={r}
                    onChange={(e) => modifierRecompense(idx, e.target.value)}
                    className="flex-1 px-2 py-1.5 rounded-sm text-sm outline-none"
                    style={{ background: "#EFE7D6", border: "1px solid rgba(107,79,46,0.15)", color: "#2A231C" }}
                  />
                  <button onClick={() => supprimerRecompense(idx)} className="opacity-50 hover:opacity-100 transition-opacity flex-shrink-0" aria-label="Supprimer">
                    <Trash2 size={15} color="#8B4A2B" />
                  </button>
                </div>
              ))}
              {recompensesListe.length === 0 && (
                <p className="text-xs italic" style={{ color: "#B3A48F" }}>Aucune récompense enregistrée.</p>
              )}
            </div>
            <div className="flex items-center gap-2">
              <input
                value={nouvelleRecompense}
                onChange={(e) => setNouvelleRecompense(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && ajouterRecompense()}
                placeholder="Nouvelle récompense..."
                className="flex-1 px-2 py-1.5 rounded-sm text-sm outline-none"
                style={{ background: "#F6F1E7", border: "1px solid rgba(107,79,46,0.25)", color: "#2A231C" }}
              />
              <button onClick={ajouterRecompense} className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full flex-shrink-0" style={{ background: "#B8863B", color: "#FBF7EE" }}>
                <Plus size={13} /> Ajouter
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function SectionLabel({ children }) {
  return <div className="text-[10px] uppercase tracking-[0.25em] mb-3" style={{ color: "#A69884" }}>{children}</div>;
}

function BarreProgression({ gauche, droite, placeholderGauche, placeholderDroite, fraction, couleur, onClickGauche, onClickDroite }) {
  return (
    <div className="mb-8">
      <div className="flex justify-between gap-3 text-xs mb-2">
        <button onClick={onClickGauche} className="text-left italic leading-snug" style={{ color: gauche ? "#4A3B2A" : "#B3A48F", maxWidth: "48%" }}>
          {gauche || placeholderGauche || "Non défini"}
        </button>
        <button onClick={onClickDroite} className="text-right italic leading-snug" style={{ color: droite ? "#4A3B2A" : "#B3A48F", maxWidth: "48%" }}>
          {droite || placeholderDroite || "Non défini"}
        </button>
      </div>
      <div style={{ height: 6, background: "#E4DAC7", borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${Math.round(fraction * 100)}%`, height: "100%", background: couleur, transition: "width 0.3s ease" }} />
      </div>
    </div>
  );
}

function PetitPasItem({ pas, onToggle, onDelete, onEdit }) {
  return (
    <div className="flex items-start gap-2.5 px-1 py-1.5">
      <button onClick={onToggle} className="flex items-center justify-center rounded-full flex-shrink-0 mt-0.5 transition-all"
        style={{ width: 20, height: 20, background: pas.fait ? "#B8863B" : "transparent", border: `1.5px solid ${pas.fait ? "#B8863B" : "#C9BBA8"}` }}>
        {pas.fait && <Check size={12} color="#FBF7EE" />}
      </button>
      <button onClick={onEdit} className="flex-1 text-left">
        <div className="text-sm" style={{ color: pas.fait ? "#A69884" : "#2A231C", textDecoration: pas.fait ? "line-through" : "none" }}>
          {pas.texte}
        </div>
        <div className="flex gap-2 mt-0.5">
          {pas.date && <span className="text-[10px]" style={{ color: "#A69884" }}>{formatDateCourte(pas.date)}</span>}
          {pas.recompense && <span className="text-[10px] italic" style={{ color: "#B8863B" }}>🎁 {pas.recompense}</span>}
        </div>
      </button>
      <button onClick={onEdit} className="opacity-40 hover:opacity-100 transition-opacity flex-shrink-0 mt-0.5" aria-label="Modifier">
        <Pencil size={13} color="#6B5F4F" />
      </button>
      <button onClick={onDelete} className="opacity-40 hover:opacity-100 transition-opacity flex-shrink-0 mt-0.5" aria-label="Supprimer">
        <Trash2 size={13} color="#8B4A2B" />
      </button>
    </div>
  );
}

function CalendrierMois({ annee, mois, value, onChange }) {
  const [ouvert, setOuvert] = useState(false);
  const nbJours = joursDansMois(annee, mois);
  const premierJourSemaine = new Date(annee, mois, 1).getDay();
  const offset = (premierJourSemaine + 6) % 7; // lundi = 0
  const cases = [];
  for (let i = 0; i < offset; i++) cases.push(null);
  for (let d = 1; d <= nbJours; d++) cases.push(d);
  const selectedDay = value ? parseInt(value.split("-")[2], 10) : null;

  return (
    <div className="relative">
      <button
        type="button"
        onClick={() => setOuvert((o) => !o)}
        className="w-full flex items-center justify-between px-2 py-1.5 rounded-sm text-sm outline-none"
        style={{ background: "#F6F1E7", border: "1px solid rgba(107,79,46,0.2)", color: value ? "#2A231C" : "#A69884" }}
      >
        <span>{value ? formatDateCourte(value) : "Date (optionnel)"}</span>
        <Calendar size={14} color="#A69884" />
      </button>
      {ouvert && (
        <div className="absolute z-40 mt-1 p-3 rounded-sm" style={{ background: "#FBF7EE", border: "1px solid rgba(107,79,46,0.25)", boxShadow: "0 8px 24px rgba(0,0,0,0.25)", width: "260px" }}>
          <div className="text-xs mb-2 text-center capitalize" style={{ color: "#6B5F4F" }}>{MOIS[mois].nom} {annee}</div>
          <div className="grid grid-cols-7 gap-1 mb-1">
            {["L", "M", "M", "J", "V", "S", "D"].map((j, i) => (
              <div key={i} className="text-[9px] text-center" style={{ color: "#A69884" }}>{j}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cases.map((d, i) =>
              d === null ? (
                <div key={i} />
              ) : (
                <button
                  key={i}
                  type="button"
                  onClick={() => { onChange(jourToISO(annee, mois, d)); setOuvert(false); }}
                  className="text-xs rounded-full flex items-center justify-center transition-colors"
                  style={{ width: 28, height: 28, background: d === selectedDay ? "#B8863B" : "transparent", color: d === selectedDay ? "#FBF7EE" : "#2A231C" }}
                >
                  {d}
                </button>
              )
            )}
          </div>
          {value && (
            <button type="button" onClick={() => { onChange(null); setOuvert(false); }} className="text-[11px] mt-2 underline" style={{ color: "#8B4A2B" }}>
              Effacer la date
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function RecompenseSelect({ value, onChange, compact, options }) {
  const liste = options || RECOMPENSES_DEFAUT;
  const estPersonnalise = value && !liste.includes(value);
  return (
    <div className="flex flex-col gap-1.5">
      <select
        value={estPersonnalise ? "__perso__" : value || ""}
        onChange={(e) => {
          if (e.target.value === "__perso__") onChange(" ");
          else onChange(e.target.value);
        }}
        className={`w-full rounded-sm outline-none ${compact ? "px-2 py-1 text-xs" : "px-2 py-1.5 text-sm"}`}
        style={{ background: compact ? "transparent" : "#F6F1E7", border: compact ? "none" : "1px solid rgba(107,79,46,0.2)", color: value ? (compact ? "#B8863B" : "#2A231C") : "#A69884", fontStyle: compact ? "italic" : "normal" }}
      >
        <option value="">🎁 Récompense (optionnel)</option>
        {liste.map((r) => (
          <option key={r} value={r}>{r}</option>
        ))}
        <option value="__perso__">Autre (à écrire)…</option>
      </select>
      {estPersonnalise && (
        <input
          value={value.trim() === "" ? "" : value}
          onChange={(e) => onChange(e.target.value)}
          placeholder="Écris ta récompense..."
          className={`w-full rounded-sm outline-none italic ${compact ? "px-2 py-1 text-xs" : "px-2 py-1.5 text-sm"}`}
          style={{ background: "#F6F1E7", border: "1px solid rgba(107,79,46,0.2)", color: "#2A231C" }}
        />
      )}
    </div>
  );
}

const racine = ReactDOM.createRoot(document.getElementById("root"));
racine.render(<JournalPrototype />);

</script>
</body>
</html>
